    <script src="../js/authUtils.js" defer></script>
    <script src="../js/cartUtils.js" defer></script>
    <script src="home.js" defer></script>

<body>
    <!-- Header Section -->
    <header>
        <div class="container">
            <div class="navbar">
                <div class="nav-toggle" id="navToggle">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="logo">
                    <img src="../Home Images/logo.png" alt="Berachah Boutique Logo" width="125">
                </div>
                <nav>
                    <ul>
                        <li><a href="../Home Page/home.html">Home</a></li>
                        <li><a href="../Shop Page/shop.html">Shop</a></li>

                            <img src="../Home Images/IMG_0243.png" alt="Fashion Banner 3">

                            <img src="../Home Images/IMG_0158.png" alt="Fashion Banner 6">

                            <img src="../Home Images/IMG_0194.png" alt="Fashion Banner 9">
