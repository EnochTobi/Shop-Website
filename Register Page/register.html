<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Berachah Boutique</title>
    <link rel="stylesheet" href="../Register Page/register.css">
    <script src="../Register Page/register.js" defer></script>
</head>

<body>
    <header>
        <div class="container">
            <h1>Create Your Account</h1>
        </div>
    </header>

    <main>
        <div class="container login-container">
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn">Register</button>
                <p>Already have an account? <a href="../Login Page/login.html">Login here</a></p>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Berachah Boutique. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
