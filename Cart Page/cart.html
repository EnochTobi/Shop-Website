<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopping Cart | Berachah Boutique</title>
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="../css/auth.css">
    <script src="../js/authUtils.js"></script>
    <script src="cart.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="container">
            <div class="navbar">
                <div class="nav-toggle" id="navToggle">
                    <i class="fas fa-bars"></i>
                </div>
                <div class="logo">
                    <img src="../Home Images/logo.png" alt="Berachah Boutique Logo" width="125">
                </div>
                <nav>
                    <ul>
                        <li><a href="../Home Page/home.html">Home</a></li>
                        <li><a href="../Shop Page/shop.html">Shop</a></li>
                        <li><a href="../About Page/about.html">About</a></li>
                        <li><a href="../Contact Page/contact.html">Contact</a></li>
                        <li><a href="../Cart Page/cart.html"><i class="fas fa-shopping-cart"></i> Cart</a></li>
                        <li class="login-register">
                            <a href="../Login Page/login.html">Login/Register</a>
                        </li>
                        <li id="nav-profile" class="nav-profile"></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>Shopping Cart</h1>
            <div class="cart-container">
                <div id="cart-items" class="cart-items">
                    <!-- Cart items will be dynamically added here -->
                </div>
                <div class="cart-summary">
                    <h2>Order Summary</h2>
                    <div class="summary-item">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-item">
                        <span>Shipping:</span>
                        <span id="shipping">$0.00</span>
                    </div>
                    <div class="summary-item total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    <button id="checkout-btn" class="checkout-btn">Proceed to Checkout</button>
                    <button id="continue-shopping" class="continue-shopping">Continue Shopping</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Berachah Boutique. All rights reserved.</p>
        </div>
    </footer>

   
</body>

</html>
