<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Berachah Boutique</title>
    <link rel="stylesheet" href="../Login Page/login.css">
    <script src="../Login Page/login.js" defer></script>
</head>

<body>
    <header>
        <div class="container">
            <h1>Login to Your Account</h1>
        </div>
    </header>

    <main>
        <div class="container login-container">
            <form id="loginForm" onsubmit="handleLogin(event)" class="login-form">
                <h2>Login</h2>
                <div class="form-group">
                    <input type="text" id="username" name="username" required placeholder="Username">
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" required placeholder="Password">
                </div>
                <button type="submit" class="login-btn">Login</button>
                <p class="register-link">Don't have an account? <a href="../Register Page/register.html">Register</a></p>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Berachah Boutique. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
